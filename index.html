<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Flip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #070710; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
  #ui { display: flex; gap: 32px; margin-bottom: 10px; color: #fff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; width: 700px; max-width: calc(100vw - 8px); justify-content: center; }
  #ui span { opacity: 0.5; }
  #ui strong { opacity: 1; color: #6ee7f7; }
  #wrapper { position: relative; width: 700px; max-width: calc(100vw - 8px); }
  canvas { display: block; width: 100%; border: 1px solid #1a1a2e; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(7,7,16,0.93); color: #fff; text-align: center; z-index: 10; }
  #overlay h1 { font-size: 42px; letter-spacing: 6px; text-transform: uppercase; color: #6ee7f7; margin-bottom: 10px; line-height: 1.2; font-family: serif; }
  #overlay p { font-size: 12px; opacity: 0.45; letter-spacing: 1px; margin-bottom: 28px; line-height: 2.2; }
  #overlay button { background: transparent; color: #6ee7f7; border: 1px solid #6ee7f7; padding: 12px 36px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; font-family: 'Courier New', monospace; }
  #overlay button:hover { background: #6ee7f722; }
  #controls { display: flex; gap: 10px; margin-top: 10px; width: 700px; max-width: calc(100vw - 8px); justify-content: center; }
  #controls button { background: transparent; color: #6ee7f7; border: 1px solid #6ee7f744; padding: 8px 18px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'Courier New', monospace; }
  #controls button:active { background: #6ee7f722; }
</style>
</head>
<body>
<div id="ui">
  <span>Soul <strong id="scoreEl">0</strong></span>
  <span>Wave <strong id="waveEl">1</strong></span>
  <span>Masks <strong id="livesEl">♦♦♦</strong></span>
  <span id="multEl" style="display:none">x<strong id="multNum">2</strong></span>
</div>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1>Gravity<br>Flip</h1>
    <p>W / UP — flip gravity up<br>S / DOWN — flip gravity down<br>A D / arrows — move<br>SPACE — dash<br>stomp crawlers to collect soul</p>
    <button id="startBtn">ENTER THE ABYSS</button>
  </div>
</div>
<div id="controls">
  <button id="btnLeft">◀</button>
  <button id="btnUp">▲ FLIP</button>
  <button id="btnDash">⚡ DASH</button>
  <button id="btnDown">▼ FLIP</button>
  <button id="btnRight">▶</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('scoreEl'),waveEl=document.getElementById('waveEl'),livesEl=document.getElementById('livesEl');
const multEl=document.getElementById('multEl'),multNum=document.getElementById('multNum');
const W=700,H=340;canvas.width=W;canvas.height=H;
const FLOOR=H-30,CEIL=30,PW=26,PH=32,GRAV=0.5;
let state='menu',score,lives,wave,invincible,spawnTimer,spawnInterval,multiplier,multTimer,audioCtx;
let enemies=[],particles=[],powerups=[],keys={},dashCooldown=0;
const player={x:160,y:0,vx:0,vy:0,gravDir:1,onGround:false,flipping:false,flipScale:1,flipDir:1,dashing:false,dashTimer:0,dashDir:1,shielded:false};

function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();playMusic();}
function beep(f,d,v,t){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=t||'square';o.frequency.setValueAtTime(f,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(f*0.5,audioCtx.currentTime+d);g.gain.setValueAtTime(v||0.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d);}
function playMusic(){if(!audioCtx)return;const notes=[165,196,220,247,165,220,196,233];let i=0;function next(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='triangle';o.frequency.value=notes[i%notes.length];g.gain.setValueAtTime(0.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);o.start();o.stop(audioCtx.currentTime+0.35);i++;setTimeout(next,380);}next();}

function flipUp(){if(state!=='playing')return;if(player.gravDir===-1)return;initAudio();player.gravDir=-1;player.vy=9;player.flipping=true;player.flipDir=-1;beep(220,0.15,0.1,'triangle');}
function flipDown(){if(state!=='playing')return;if(player.gravDir===1)return;initAudio();player.gravDir=1;player.vy=-9;player.flipping=true;player.flipDir=1;beep(165,0.15,0.1,'triangle');}
function doDash(){if(state!=='playing'||dashCooldown>0)return;initAudio();player.dashing=true;player.dashTimer=12;player.dashDir=player.vx<0?-1:1;dashCooldown=45;beep(440,0.08,0.15,'sawtooth');emit(player.x+PW/2,player.y+PH/2,'#6ee7f7',8);}

function initGame(){score=0;lives=3;wave=1;enemies=[];particles=[];powerups=[];invincible=0;spawnTimer=0;spawnInterval=110;multiplier=1;multTimer=0;dashCooldown=0;player.x=160;player.y=FLOOR-PH;player.vx=0;player.vy=0;player.gravDir=1;player.onGround=false;player.dashing=false;player.shielded=false;updateUI();}

function spawnEnemy(){const side=Math.random()<0.5?'L':'R',type=Math.random();let e={x:side==='L'?-40:W+40,alive:true,wobble:0,w:28,h:28};const spd=(1+wave*0.2+Math.random()*0.6)*(side==='L'?1:-1);if(type<0.45){e.type='normal';e.vx=spd;e.y=FLOOR-e.h;e.onCeil=false;e.hp=1;}else if(type<0.7){e.type='ceil';e.vx=spd*1.1;e.y=CEIL;e.onCeil=true;e.hp=1;}else if(type<0.85){e.type='big';e.vx=spd*0.5;e.w=42;e.h=42;e.y=FLOOR-e.h;e.onCeil=false;e.hp=2;}else{e.type='fast';e.vx=spd*2.2;e.w=18;e.h=18;e.y=FLOOR-e.h;e.onCeil=false;e.hp=1;}enemies.push(e);}
function spawnPowerup(){const types=['shield','multi','life'],t=types[Math.floor(Math.random()*3)];powerups.push({x:80+Math.random()*(W-160),y:CEIL+20+Math.random()*(FLOOR-CEIL-60),type:t,life:300,pulse:0});}
function emit(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3.5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.035+Math.random()*0.03,r:2+Math.random()*3,color:col});}}
function updateUI(){scoreEl.textContent=score;waveEl.textContent=wave;livesEl.innerHTML=lives>=3?'♦♦♦':lives===2?'♦♦◇':lives===1?'♦◇◇':'◇◇◇';if(multiplier>1){multEl.style.display='';multNum.textContent=multiplier;}else{multEl.style.display='none';}}

function update(){
  if(state!=='playing')return;
  let ms=3.2;if(player.dashing)ms=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])player.vx=-ms;
  else if(keys['ArrowRight']||keys['d']||keys['D'])player.vx=ms;
  else player.vx*=0.75;
  if(player.dashing){player.vx=player.dashDir*11;player.dashTimer--;if(player.dashTimer<=0){player.dashing=false;player.vx=0;}}
  if(dashCooldown>0)dashCooldown--;
  player.vy+=GRAV*player.gravDir;player.x+=player.vx;player.y+=player.vy;
  player.x=Math.max(0,Math.min(W-PW,player.x));
  if(player.gravDir===1){if(player.y+PH>=FLOOR){player.y=FLOOR-PH;player.vy=0;player.onGround=true;}else player.onGround=false;if(player.y<=CEIL){player.y=CEIL;player.vy=0;}}
  else{if(player.y<=CEIL){player.y=CEIL;player.vy=0;player.onGround=true;}else player.onGround=false;if(player.y+PH>=FLOOR){player.y=FLOOR-PH;player.vy=0;}}
  if(player.flipping){player.flipScale+=player.flipDir*0.2;if(Math.abs(player.flipScale)>1.15)player.flipDir*=-1;if(player.flipScale>=1&&player.flipDir===1){player.flipScale=1;player.flipping=false;}}
  if(invincible>0)invincible--;
  if(multTimer>0){multTimer--;if(multTimer===0){multiplier=1;updateUI();}}
  spawnTimer++;if(spawnTimer>=spawnInterval){spawnTimer=0;spawnEnemy();if(Math.random()<0.15+wave*0.03)spawnEnemy();spawnInterval=Math.max(38,spawnInterval-2);}
  if(Math.random()<0.003&&powerups.length<2)spawnPowerup();
  if(score>=wave*8&&enemies.length===0){wave++;updateUI();beep(330,0.3,0.1);}
  for(let e of enemies){
    if(!e.alive)continue;e.x+=e.vx;e.wobble+=0.13;
    const ox=player.x+PW>e.x&&player.x<e.x+e.w,oy=player.y+PH>e.y&&player.y<e.y+e.h;
    if(ox&&oy){
      const sd=player.gravDir===1&&player.vy>1&&player.y+PH-player.vy<=e.y+6;
      const su=player.gravDir===-1&&player.vy<-1&&player.y-player.vy>=e.y+e.h-6;
      if(sd||su||player.dashing){e.hp--;if(e.hp<=0){e.alive=false;score+=multiplier*(e.type==='big'?3:e.type==='fast'?2:1);scoreEl.textContent=score;emit(e.x+e.w/2,e.y+e.h/2,'#6ee7f7',14);beep(180,0.15,0.1,'triangle');}else emit(e.x+e.w/2,e.y+e.h/2,'#fff',5);player.vy=-6*player.gravDir;}
      else if(invincible===0){if(player.shielded){player.shielded=false;invincible=60;emit(player.x+PW/2,player.y+PH/2,'#6ee7f7',12);beep(300,0.2,0.1);}else{lives--;invincible=90;updateUI();emit(player.x+PW/2,player.y+PH/2,'#f87171',12);beep(120,0.25,0.12);if(lives<=0){gameOver();return;}}}
    }
    if(e.x<-60||e.x>W+60)e.alive=false;
  }
  enemies=enemies.filter(e=>e.alive);
  for(let p of powerups){p.life--;p.pulse+=0.1;if(player.x+PW>p.x-14&&player.x<p.x+14&&player.y+PH>p.y-14&&player.y<p.y+14){if(p.type==='shield'){player.shielded=true;beep(550,0.2,0.1);}else if(p.type==='multi'){multiplier=2;multTimer=300;updateUI();beep(440,0.2,0.1);}else{lives=Math.min(3,lives+1);updateUI();beep(330,0.2,0.1);}emit(p.x,p.y,p.type==='shield'?'#6ee7f7':p.type==='multi'?'#fbbf24':'#86efac',16);p.life=0;}}
  powerups=powerups.filter(p=>p.life>0);
  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.91;p.vy*=0.91;p.life-=p.decay;}
  particles=particles.filter(p=>p.life>0);
}

function gameOver(){state='gameover';overlay.innerHTML=`<h1 style="color:#f87171;font-family:serif">Hollow<br>Defeat</h1><p>SOUL &nbsp;<strong style="color:#6ee7f7;opacity:1;font-size:18px">${score}</strong><br>WAVE &nbsp;<strong style="color:#6ee7f7;opacity:1">${wave}</strong></p><button id="startBtn">TRY AGAIN</button>`;overlay.style.display='flex';overlay.querySelector('#startBtn').addEventListener('click',startGame);}

function drawEnemy(e){
  const wx=Math.sin(e.wobble)*2;ctx.save();ctx.translate(e.x+e.w/2+wx,e.y+e.h/2);
  if(e.onCeil)ctx.scale(e.vx<0?-1:1,-1);else ctx.scale(e.vx<0?-1:1,1);
  const s=e.w/28;ctx.scale(s,s);
  const gc=e.type==='big'?'#a78bfa':e.type==='fast'?'#f59e0b':e.type==='ceil'?'#60a5fa':'#4ade80';
  const bc=e.type==='big'?'#2d1b4e':e.type==='fast'?'#3b1a08':e.type==='ceil'?'#0f2744':'#1a2a1a';
  ctx.shadowBlur=8;ctx.shadowColor=gc;
  ctx.beginPath();ctx.moveTo(0,-14);ctx.bezierCurveTo(11,-12,12,2,8,12);ctx.bezierCurveTo(4,18,-4,18,-8,12);ctx.bezierCurveTo(-12,2,-11,-12,0,-14);
  ctx.fillStyle=bc;ctx.fill();ctx.strokeStyle=gc;ctx.lineWidth=1.5;ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.moveTo(-3,-12);ctx.bezierCurveTo(-7,-6,-7,3,-3,9);ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;ctx.stroke();
  ctx.shadowBlur=6;ctx.shadowColor=gc;ctx.fillStyle=gc;
  ctx.beginPath();ctx.ellipse(-4,-2,3.5,4.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(4,-2,3.5,4.5,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(-4,-2,1.2,2.5,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(4,-2,1.2,2.5,0,0,Math.PI*2);ctx.fill();
  const lo=Math.sin(e.wobble*2)*4;ctx.strokeStyle=gc+'88';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-7,7);ctx.lineTo(-13,14+lo);ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,7);ctx.lineTo(13,14-lo);ctx.stroke();
  if(e.type==='big'&&e.hp===2){ctx.fillStyle='#fbbf24';ctx.fillRect(-10,-20,20,3);}
  ctx.restore();
}

function drawPlayer(){
  const blink=invincible>0&&Math.floor(invincible/6)%2===0;if(blink)return;
  ctx.save();ctx.translate(player.x+PW/2,player.y+PH/2);ctx.scale(1,player.flipScale);
  if(player.dashing){ctx.globalAlpha=0.15;for(let i=1;i<=3;i++){ctx.fillStyle='#6ee7f7';ctx.beginPath();ctx.ellipse(-player.dashDir*i*8,0,8,14,0,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
  if(player.shielded){ctx.save();ctx.globalAlpha=0.18+Math.sin(Date.now()/200)*0.07;ctx.shadowBlur=20;ctx.shadowColor='#6ee7f7';ctx.beginPath();ctx.arc(0,0,26,0,Math.PI*2);ctx.fillStyle='#6ee7f7';ctx.fill();ctx.restore();}
  ctx.fillStyle='#0d0d1e';ctx.beginPath();ctx.moveTo(-5,-10);ctx.lineTo(-18,2);ctx.lineTo(-15,16);ctx.lineTo(-5,12);ctx.closePath();ctx.fill();ctx.strokeStyle='#2a2a4a';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.moveTo(0,-14);ctx.bezierCurveTo(11,-14,11,8,7,14);ctx.lineTo(-7,14);ctx.bezierCurveTo(-11,8,-11,-14,0,-14);ctx.fill();ctx.strokeStyle='#3a3a6a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.strokeStyle='#6ee7f733';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-4,-2);ctx.lineTo(4,-2);ctx.moveTo(0,-6);ctx.lineTo(0,4);ctx.stroke();
  ctx.strokeStyle='#d1d5db';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,-13);ctx.quadraticCurveTo(-8,-20,-6,-24);ctx.stroke();ctx.beginPath();ctx.moveTo(5,-13);ctx.quadraticCurveTo(8,-20,6,-24);ctx.stroke();
  ctx.shadowBlur=8;ctx.shadowColor='#6ee7f7';ctx.fillStyle='#6ee7f7';ctx.beginPath();ctx.ellipse(-3,-4,2.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(3,-4,2.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.shadowBlur=5;ctx.shadowColor='#e2e8f0';ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(9,2);ctx.lineTo(21,16);ctx.stroke();ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(12,5);ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle='#3a3a6a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,13);ctx.lineTo(-7,20);ctx.lineTo(-11,22);ctx.stroke();ctx.beginPath();ctx.moveTo(4,13);ctx.lineTo(7,20);ctx.lineTo(11,22);ctx.stroke();
  ctx.restore();
  ctx.shadowBlur=6;ctx.shadowColor='#6ee7f7';ctx.fillStyle='#6ee7f7';ctx.globalAlpha=0.55;ctx.beginPath();
  if(player.gravDir===1){ctx.moveTo(player.x+PW/2,player.y+PH+10);ctx.lineTo(player.x+PW/2-4,player.y+PH+4);ctx.lineTo(player.x+PW/2+4,player.y+PH+4);}
  else{ctx.moveTo(player.x+PW/2,player.y-10);ctx.lineTo(player.x+PW/2-4,player.y-4);ctx.lineTo(player.x+PW/2+4,player.y-4);}
  ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
  if(dashCooldown>0){ctx.fillStyle='#1e293b';ctx.fillRect(player.x,player.y+PH+5,PW,3);ctx.shadowBlur=4;ctx.shadowColor='#6ee7f7';ctx.fillStyle='#6ee7f7';ctx.fillRect(player.x,player.y+PH+5,PW*(1-dashCooldown/45),3);ctx.shadowBlur=0;}
}

function draw(){
  const t=Date.now()/1000;
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#070710');bg.addColorStop(1,'#0d0d1e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){const ox=60+i*130+Math.sin(t*0.3+i)*20,oy=CEIL+25+(FLOOR-CEIL)*0.4+Math.sin(t*0.5+i*1.5)*25;ctx.save();ctx.globalAlpha=0.06+Math.sin(t*0.8+i)*0.02;ctx.shadowBlur=15;ctx.shadowColor='#6ee7f7';ctx.fillStyle='#6ee7f7';ctx.beginPath();ctx.arc(ox,oy,4,0,Math.PI*2);ctx.fill();ctx.restore();}
  ctx.fillStyle='#07070f';ctx.fillRect(0,0,W,CEIL);ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.strokeStyle='#10102a';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+15,CEIL);ctx.stroke();ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+15,FLOOR);ctx.stroke();}
  ctx.shadowBlur=8;ctx.shadowColor='#6ee7f744';ctx.fillStyle='#6ee7f755';ctx.fillRect(0,CEIL-1,W,1);ctx.fillRect(0,FLOOR,W,1);ctx.shadowBlur=0;
  ctx.fillStyle='#0b0b1d';ctx.strokeStyle='#181832';ctx.lineWidth=1;
  for(let x=18;x<W;x+=45){const h1=14+Math.sin(x*0.3)*5;ctx.beginPath();ctx.moveTo(x-7,CEIL);ctx.lineTo(x+7,CEIL);ctx.lineTo(x,CEIL+h1);ctx.closePath();ctx.fill();ctx.stroke();const h2=12+Math.cos(x*0.3)*4;ctx.beginPath();ctx.moveTo(x-6,FLOOR);ctx.lineTo(x+6,FLOOR);ctx.lineTo(x,FLOOR-h2);ctx.closePath();ctx.fill();ctx.stroke();}
  for(let p of powerups){const pulse=Math.sin(p.pulse)*3,col=p.type==='shield'?'#6ee7f7':p.type==='multi'?'#fbbf24':'#86efac';ctx.save();ctx.translate(p.x,p.y);ctx.shadowBlur=14;ctx.shadowColor=col;ctx.globalAlpha=0.2+Math.sin(p.pulse)*0.1;ctx.beginPath();ctx.arc(0,0,14+pulse,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=col;ctx.font='bold 14px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.type==='shield'?'◈':p.type==='multi'?'◆':'♦',0,1);ctx.shadowBlur=0;ctx.restore();}
  for(let p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.shadowBlur=5;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();}
  for(let e of enemies){if(e.alive)drawEnemy(e);}
  drawPlayer();
}

function loop(){update();draw();requestAnimationFrame(loop);}
function startGame(){state='playing';overlay.style.display='none';initGame();initAudio();}

document.getElementById('startBtn').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{keys[e.key]=true;if(state!=='playing')return;if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();flipUp();}if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();flipDown();}if(e.code==='Space'){e.preventDefault();doDash();}if(e.code==='ShiftLeft'||e.code==='ShiftRight')doDash();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
document.getElementById('btnUp').addEventListener('click',flipUp);
document.getElementById('btnDown').addEventListener('click',flipDown);
document.getElementById('btnDash').addEventListener('click',doDash);
const bL=document.getElementById('btnLeft'),bR=document.getElementById('btnRight');
bL.addEventListener('pointerdown',()=>{keys['ArrowLeft']=true;});bL.addEventListener('pointerup',()=>{keys['ArrowLeft']=false;});bL.addEventListener('pointerleave',()=>{keys['ArrowLeft']=false;});
bR.addEventListener('pointerdown',()=>{keys['ArrowRight']=true;});bR.addEventListener('pointerup',()=>{keys['ArrowRight']=false;});bR.addEventListener('pointerleave',()=>{keys['ArrowRight']=false;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();},{ passive:false});
loop();
</script>
</body>
</html>

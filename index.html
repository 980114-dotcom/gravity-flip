<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Flip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #ui {
    display: flex;
    gap: 32px;
    margin-bottom: 10px;
    color: #fff;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 700px;
    max-width: calc(100vw - 8px);
    justify-content: center;
  }
  #ui span { opacity: 0.5; }
  #ui strong { opacity: 1; color: #a78bfa; }
  #wrapper {
    position: relative;
    width: 700px;
    max-width: calc(100vw - 8px);
  }
  canvas { display: block; width: 100%; border: 1px solid #2a2a3a; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,15,0.92);
    color: #fff;
    text-align: center;
    z-index: 10;
  }
  #overlay h1 {
    font-size: 42px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 10px;
    line-height: 1.2;
  }
  #overlay p {
    font-size: 12px;
    opacity: 0.5;
    letter-spacing: 1px;
    margin-bottom: 28px;
    line-height: 2.2;
  }
  #overlay button {
    background: #a78bfa;
    color: #0a0a0f;
    border: none;
    padding: 12px 36px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-weight: bold;
  }
  #overlay button:hover { background: #c4b5fd; }
  #controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    width: 700px;
    max-width: calc(100vw - 8px);
    justify-content: center;
  }
  #controls button {
    background: transparent;
    color: #a78bfa;
    border: 1px solid #a78bfa44;
    padding: 8px 18px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Courier New', monospace;
  }
  #controls button:active { background: #a78bfa22; }
</style>
</head>
<body>

<div id="ui">
  <span>Score <strong id="scoreEl">0</strong></span>
  <span>Wave <strong id="waveEl">1</strong></span>
  <span>Lives <strong id="livesEl">♦♦♦</strong></span>
  <span id="multEl" style="display:none">x<strong id="multNum">2</strong></span>
</div>

<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1>Gravity<br>Flip</h1>
    <p>
      SPACE / TAP — flip gravity<br>
      A D / ← → — move left &amp; right<br>
      SHIFT / double-tap — dash<br>
      stomp enemies to score<br>
      collect power-ups ★
    </p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<div id="controls">
  <button id="btnLeft">◀ LEFT</button>
  <button id="btnFlip">↕ FLIP</button>
  <button id="btnDash">⚡ DASH</button>
  <button id="btnRight">RIGHT ▶</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreEl');
const waveEl = document.getElementById('waveEl');
const livesEl = document.getElementById('livesEl');
const multEl = document.getElementById('multEl');
const multNum = document.getElementById('multNum');

const W = 700;
const H = 340;
canvas.width = W;
canvas.height = H;

const FLOOR = H - 30;
const CEIL = 30;
const PLAYER_W = 26;
const PLAYER_H = 32;
const GRAVITY = 0.5;

let state = 'menu';
let score, lives, wave, invincible, spawnTimer, spawnInterval, multiplier, multTimer, audioCtx;
let enemies = [], particles = [], powerups = [];

const keys = {};
let dashCooldown = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  playMusic();
}

function beep(freq, dur, vol, type) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
  g.gain.setValueAtTime((vol || 0.15), audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playMusic() {
  if (!audioCtx) return;
  const notes = [220, 277, 330, 415, 220, 330, 277, 370];
  let i = 0;
  function next() {
    if (!audioCtx || state === 'dead') return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle';
    o.frequency.value = notes[i % notes.length];
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
    i++;
    setTimeout(next, 220);
  }
  next();
}

const player = {
  x: 160, y: 0, vx: 0, vy: 0, gravDir: 1,
  onGround: false, flipping: false, flipScale: 1, flipDir: 1,
  dashing: false, dashTimer: 0, dashDir: 1,
  shielded: false,
};

function initGame() {
  score = 0; lives = 3; wave = 1;
  enemies = []; particles = []; powerups = [];
  invincible = 0; spawnTimer = 0; spawnInterval = 110;
  multiplier = 1; multTimer = 0; dashCooldown = 0;
  player.x = 160; player.y = FLOOR - PLAYER_H;
  player.vx = 0; player.vy = 0;
  player.gravDir = 1; player.onGround = false;
  player.dashing = false; player.shielded = false;
  updateUI();
}

function flipGravity() {
  if (state !== 'playing') return;
  initAudio();
  player.gravDir *= -1;
  player.vy = -9 * player.gravDir;
  player.flipping = true;
  player.flipDir = player.gravDir;
  beep(330, 0.12, 0.12);
}

function doDash() {
  if (state !== 'playing') return;
  if (dashCooldown > 0) return;
  initAudio();
  player.dashing = true;
  player.dashTimer = 12;
  player.dashDir = player.vx >= 0 ? 1 : -1;
  if (player.dashDir === 0) player.dashDir = 1;
  dashCooldown = 45;
  beep(550, 0.08, 0.18, 'sawtooth');
  emitParticles(player.x + PLAYER_W/2, player.y + PLAYER_H/2, '#67e8f9', 8);
}

function spawnEnemy() {
  const side = Math.random() < 0.5 ? 'L' : 'R';
  const type = Math.random();
  let e = { x: side === 'L' ? -40 : W + 40, alive: true, wobble: 0, w: 28, h: 28 };
  const spd = (1 + wave * 0.2 + Math.random() * 0.6) * (side === 'L' ? 1 : -1);
  if (type < 0.45) {
    e.type = 'normal'; e.vx = spd; e.vy = 0;
    e.y = FLOOR - e.h; e.onCeil = false; e.color = '#f87171'; e.hp = 1;
  } else if (type < 0.7) {
    e.type = 'ceil'; e.vx = spd * 1.1; e.vy = 0;
    e.y = CEIL; e.onCeil = true; e.color = '#fb923c'; e.hp = 1;
  } else if (type < 0.85) {
    e.type = 'big'; e.vx = spd * 0.5; e.vy = 0;
    e.w = 42; e.h = 42; e.y = FLOOR - e.h; e.onCeil = false; e.color = '#e879f9'; e.hp = 2;
  } else {
    e.type = 'fast'; e.vx = spd * 2.2; e.vy = 0;
    e.w = 18; e.h = 18; e.y = FLOOR - e.h; e.onCeil = false; e.color = '#facc15'; e.hp = 1;
  }
  enemies.push(e);
}

function spawnPowerup() {
  const types = ['shield', 'multi', 'life'];
  const t = types[Math.floor(Math.random() * types.length)];
  powerups.push({ x: 80 + Math.random() * (W - 160), y: CEIL + 20 + Math.random() * (FLOOR - CEIL - 60), type: t, life: 300, maxLife: 300, pulse: 0 });
}

function emitParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, life: 1, decay: 0.035 + Math.random() * 0.03, r: 2 + Math.random() * 3, color });
  }
}

function updateUI() {
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  if (lives >= 3) livesEl.innerHTML = '♦♦♦';
  else if (lives === 2) livesEl.innerHTML = '♦♦◇';
  else if (lives === 1) livesEl.innerHTML = '♦◇◇';
  else livesEl.innerHTML = '◇◇◇';
  if (multiplier > 1) { multEl.style.display=''; multNum.textContent = multiplier; }
  else { multEl.style.display = 'none'; }
}

function update() {
  if (state !== 'playing') return;
  let moveSpd = 3.2;
  if (player.dashing) moveSpd = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.vx = -moveSpd;
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) player.vx = moveSpd;
  else player.vx *= 0.75;
  if (player.dashing) {
    player.vx = player.dashDir * 11;
    player.dashTimer--;
    if (player.dashTimer <= 0) { player.dashing = false; player.vx = 0; }
  }
  if (dashCooldown > 0) dashCooldown--;
  player.vy += GRAVITY * player.gravDir;
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(0, Math.min(W - PLAYER_W, player.x));
  if (player.gravDir === 1) {
    if (player.y + PLAYER_H >= FLOOR) { player.y = FLOOR - PLAYER_H; player.vy = 0; player.onGround = true; }
    else player.onGround = false;
    if (player.y <= CEIL) { player.y = CEIL; player.vy = 0; }
  } else {
    if (player.y <= CEIL) { player.y = CEIL; player.vy = 0; player.onGround = true; }
    else player.onGround = false;
    if (player.y + PLAYER_H >= FLOOR) { player.y = FLOOR - PLAYER_H; player.vy = 0; }
  }
  if (player.flipping) {
    player.flipScale += player.flipDir * 0.2;
    if (Math.abs(player.flipScale) > 1.15) player.flipDir *= -1;
    if (player.flipScale >= 1 && player.flipDir === 1) { player.flipScale = 1; player.flipping = false; }
  }
  if (invincible > 0) invincible--;
  if (multTimer > 0) { multTimer--; if (multTimer === 0) { multiplier = 1; updateUI(); } }
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0; spawnEnemy();
    if (Math.random() < 0.15 + wave * 0.03) spawnEnemy();
    spawnInterval = Math.max(38, spawnInterval - 2);
  }
  if (Math.random() < 0.003 && powerups.length < 2) spawnPowerup();
  const nextWave = wave * 8;
  if (score >= nextWave && enemies.length === 0) { wave++; updateUI(); beep(440, 0.3, 0.2); }
  for (let e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx; e.wobble += 0.13;
    const px = player.x, py = player.y, pw = PLAYER_W, ph = PLAYER_H;
    const ox = px + pw > e.x && px < e.x + e.w;
    const oy = py + ph > e.y && py < e.y + e.h;
    if (ox && oy) {
      const stompDown = player.gravDir === 1 && player.vy > 1 && py + ph - player.vy <= e.y + 6;
      const stompUp = player.gravDir === -1 && player.vy < -1 && py - player.vy >= e.y + e.h - 6;
      const dashKill = player.dashing;
      if (stompDown || stompUp || dashKill) {
        e.hp--;
        if (e.hp <= 0) {
          e.alive = false;
          const pts = multiplier * (e.type === 'big' ? 3 : e.type === 'fast' ? 2 : 1);
          score += pts; scoreEl.textContent = score;
          emitParticles(e.x + e.w/2, e.y + e.h/2, e.color, 14);
          beep(220, 0.15, 0.15);
        } else { emitParticles(e.x + e.w/2, e.y + e.h/2, '#fff', 6); }
        player.vy = -6 * player.gravDir;
      } else if (invincible === 0) {
        if (player.shielded) {
          player.shielded = false; invincible = 60;
          emitParticles(px + pw/2, py + ph/2, '#67e8f9', 12); beep(300, 0.2, 0.15);
        } else {
          lives--; invincible = 90; updateUI();
          emitParticles(px + pw/2, py + ph/2, '#f87171', 12); beep(150, 0.25, 0.2);
          if (lives <= 0) { gameOver(); return; }
        }
      }
    }
    if (e.x < -60 || e.x > W + 60) e.alive = false;
  }
  enemies = enemies.filter(e => e.alive);
  for (let p of powerups) {
    p.life--; p.pulse += 0.1;
    const px = player.x, py = player.y;
    if (px + PLAYER_W > p.x - 14 && px < p.x + 14 && py + PLAYER_H > p.y - 14 && py < p.y + 14) {
      if (p.type === 'shield') { player.shielded = true; beep(660, 0.2, 0.18); }
      else if (p.type === 'multi') { multiplier = 2; multTimer = 300; updateUI(); beep(550, 0.2, 0.18); }
      else if (p.type === 'life') { lives = Math.min(3, lives + 1); updateUI(); beep(440, 0.2, 0.18); }
      emitParticles(p.x, p.y, p.type === 'shield' ? '#67e8f9' : p.type === 'multi' ? '#a78bfa' : '#4ade80', 16);
      p.life = 0;
    }
  }
  powerups = powerups.filter(p => p.life > 0);
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.91; p.vy *= 0.91; p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function gameOver() {
  state = 'gameover';
  overlay.innerHTML = `<h1 style="color:#f87171;font-size:38px">Game<br>Over</h1><p>SCORE &nbsp;<strong style="color:#a78bfa;opacity:1;font-size:18px">${score}</strong><br>WAVE &nbsp;<strong style="color:#a78bfa;opacity:1">${wave}</strong></p><button onclick="startGame()">PLAY AGAIN</button>`;
  overlay.style.display = 'flex';
}

function rr(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0d0d18'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#16162a'; ctx.lineWidth = 1;
  for (let x=0;x<W;x+=40) { ctx.beginPath(); ctx.moveTo(x,CEIL); ctx.lineTo(x,FLOOR); ctx.stroke(); }
  ctx.fillStyle = '#1a1a30'; ctx.fillRect(0,0,W,CEIL); ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle = '#a78bfa'; ctx.fillRect(0,CEIL-2,W,2); ctx.fillRect(0,FLOOR,W,2);
  ctx.fillStyle = '#252545';
  for (let x=8;x<W;x+=22) {
    ctx.beginPath(); ctx.moveTo(x,FLOOR); ctx.lineTo(x+8,FLOOR+12); ctx.lineTo(x+16,FLOOR); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x,CEIL); ctx.lineTo(x+8,CEIL-12); ctx.lineTo(x+16,CEIL); ctx.fill();
  }
  for (let p of powerups) {
    const pulse = Math.sin(p.pulse) * 3;
    const col = p.type==='shield' ? '#67e8f9' : p.type==='multi' ? '#a78bfa' : '#4ade80';
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.globalAlpha = 0.3 + Math.sin(p.pulse)*0.15;
    ctx.beginPath(); ctx.arc(0,0,14+pulse,0,Math.PI*2); ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = col;
    ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.type==='shield' ? '🛡' : p.type==='multi' ? '★' : '♥', 0, 1);
    ctx.restore();
  }
  for (let p of particles) {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let e of enemies) {
    if (!e.alive) continue;
    const wx = Math.sin(e.wobble)*2;
    ctx.save(); ctx.translate(e.x+e.w/2+wx, e.y+e.h/2);
    if (e.onCeil) ctx.scale(e.vx<0?-1:1,-1); else ctx.scale(e.vx<0?-1:1,1);
    const s = e.w/28; ctx.scale(s,s);
    rr(-12,-12,24,24,5,e.color);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-3,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-3,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-3,-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-2,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(1,4,5,0.2,Math.PI-0.2); ctx.stroke();
    const lo = Math.sin(e.wobble*2)*5;
    ctx.fillStyle=e.color; ctx.fillRect(-10,12,6,4+lo); ctx.fillRect(4,12,6,4-lo);
    if (e.type==='big' && e.hp===2) { ctx.fillStyle='#fff'; ctx.fillRect(-6,-16,12,3); }
    ctx.restore();
  }
  const px=player.x, py=player.y;
  const blink = invincible>0 && Math.floor(invincible/6)%2===0;
  if (!blink) {
    ctx.save(); ctx.translate(px+PLAYER_W/2, py+PLAYER_H/2); ctx.scale(1, player.flipScale);
    if (player.dashing) { ctx.globalAlpha=0.3; ctx.fillStyle='#67e8f9'; ctx.fillRect(-10*player.dashDir-14,-14,20,28); ctx.globalAlpha=1; }
    if (player.shielded) { ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fillStyle='#67e8f9'; ctx.fill(); ctx.globalAlpha=1; }
    ctx.fillStyle='#7c3aed'; ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-6,-10); ctx.lineTo(-6,10); ctx.fill();
    rr(-10,-14,20,28,4,'#a78bfa');
    ctx.fillStyle='#0d0d18'; ctx.fillRect(-7,-10,14,8);
    ctx.fillStyle='#67e8f9'; ctx.fillRect(-6,-9,5,6); ctx.fillRect(1,-9,5,6);
    ctx.fillStyle='#7c3aed'; ctx.fillRect(-9,12,8,6); ctx.fillRect(1,12,8,6);
    ctx.restore();
    ctx.fillStyle='#a78bfa'; ctx.globalAlpha=0.45; ctx.beginPath();
    if (player.gravDir===1) { ctx.moveTo(px+PLAYER_W/2,py+PLAYER_H+9); ctx.lineTo(px+PLAYER_W/2-5,py+PLAYER_H+3); ctx.lineTo(px+PLAYER_W/2+5,py+PLAYER_H+3); }
    else { ctx.moveTo(px+PLAYER_W/2,py-9); ctx.lineTo(px+PLAYER_W/2-5,py-3); ctx.lineTo(px+PLAYER_W/2+5,py-3); }
    ctx.fill(); ctx.globalAlpha=1;
    if (dashCooldown>0) { ctx.fillStyle='#333'; ctx.fillRect(px,py+PLAYER_H+4,PLAYER_W,3); ctx.fillStyle='#67e8f9'; ctx.fillRect(px,py+PLAYER_H+4,PLAYER_W*(1-dashCooldown/45),3); }
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function startGame() {
  state='playing'; overlay.style.display='none'; initGame(); initAudio();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.addEventListener('keydown', e => {
  keys[e.key]=true;
  if (state !== 'playing') return;
  if (e.code==='ArrowUp'||e.code==='KeyW') { e.preventDefault(); flipGravity(); }
  if (e.code==='ArrowDown'||e.code==='KeyS') { e.preventDefault(); flipGravity(); }
  if (e.code==='Space') { e.preventDefault(); doDash(); }
  if (e.code==='ShiftLeft'||e.code==='ShiftRight') doDash();
});
document.addEventListener('keyup', e => { keys[e.key]=false; });
document.getElementById('btnFlip').addEventListener('click', flipGravity);
document.getElementById('btnDash').addEventListener('click', doDash);
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
btnLeft.addEventListener('pointerdown', ()=>{ keys['ArrowLeft']=true; });
btnLeft.addEventListener('pointerup', ()=>{ keys['ArrowLeft']=false; });
btnLeft.addEventListener('pointerleave', ()=>{ keys['ArrowLeft']=false; });
btnRight.addEventListener('pointerdown', ()=>{ keys['ArrowRight']=true; });
btnRight.addEventListener('pointerup', ()=>{ keys['ArrowRight']=false; });
btnRight.addEventListener('pointerleave', ()=>{ keys['ArrowRight']=false; });
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); flipGravity(); }, {passive:false});

loop();
</script>
</body>
</html>

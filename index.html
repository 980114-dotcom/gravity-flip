<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Flip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #ui {
    display: flex;
    gap: 40px;
    margin-bottom: 12px;
    color: #fff;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #ui span { opacity: 0.6; }
  #ui strong { opacity: 1; color: #a78bfa; }
  canvas {
    border: 1px solid #2a2a3a;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,15,0.88);
    color: #fff;
    text-align: center;
  }
  #overlay h1 {
    font-size: 48px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 12px;
  }
  #overlay p { font-size: 13px; opacity: 0.5; letter-spacing: 2px; margin-bottom: 32px; line-height: 2; }
  #overlay button {
    background: #a78bfa;
    color: #0a0a0f;
    border: none;
    padding: 12px 36px;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-weight: bold;
  }
  #overlay button:hover { background: #c4b5fd; }
  #mobileBtn {
    margin-top: 12px;
    background: #a78bfa;
    color: #0a0a0f;
    border: none;
    padding: 10px 32px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    display: none;
  }
</style>
</head>
<body>

<div id="ui">
  <span>Score <strong id="scoreEl">0</strong></span>
  <span>Wave <strong id="waveEl">1</strong></span>
  <span>Lives <strong id="livesEl">&#9632;&#9632;&#9632;</strong></span>
</div>
<canvas id="c"></canvas>
<button id="mobileBtn">FLIP GRAVITY</button>

<div id="overlay">
  <h1>Gravity<br>Flip</h1>
  <p>
    SPACE / TAP — flip gravity<br>
    LAND ON ENEMIES to kill them<br>
    DON'T get touched sideways
  </p>
  <button id="startBtn">START GAME</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreEl');
const waveEl = document.getElementById('waveEl');
const livesEl = document.getElementById('livesEl');
const mobileBtn = document.getElementById('mobileBtn');

const W = Math.min(700, window.innerWidth - 8);
const H = 340;
canvas.width = W;
canvas.height = H;

const FLOOR = H - 30;
const CEIL = 30;
const PLAYER_W = 28;
const PLAYER_H = 34;
const ENEMY_W = 30;
const ENEMY_H = 30;
const GRAVITY = 0.55;
const JUMP_FORCE = -12;

let state = 'menu';
let score, lives, wave, enemies, particles, invincible, spawnTimer, spawnInterval;

function isMobile() { return window.innerWidth < 600; }

function initGame() {
  score = 0;
  lives = 3;
  wave = 1;
  enemies = [];
  particles = [];
  invincible = 0;
  spawnTimer = 0;
  spawnInterval = 120;
  player.x = W * 0.25;
  player.y = FLOOR - PLAYER_H;
  player.vy = 0;
  player.gravDir = 1;
  player.onGround = true;
  updateUI();
}

const player = {
  x: 100, y: 260, vy: 0, gravDir: 1, onGround: false,
  flipping: false, flipScale: 1, flipDir: 1,
};

function flipGravity() {
  if (state !== 'playing') return;
  player.gravDir *= -1;
  player.vy = JUMP_FORCE * player.gravDir * -1;
  player.flipping = true;
  player.flipDir = player.gravDir;
}

function spawnEnemy() {
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const onCeil = Math.random() < 0.35;
  const speed = (0.9 + wave * 0.18 + Math.random() * 0.5) * (side === 'left' ? 1 : -1);
  enemies.push({
    x: side === 'left' ? -ENEMY_W : W + ENEMY_W,
    y: onCeil ? CEIL : FLOOR - ENEMY_H,
    vy: 0,
    vx: speed,
    onCeil,
    w: ENEMY_W, h: ENEMY_H,
    alive: true,
    wobble: 0,
  });
}

function emitParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.04 + Math.random() * 0.03,
      r: 2 + Math.random() * 3,
      color,
    });
  }
}

function updateUI() {
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  if (lives >= 3) livesEl.innerHTML = '&#9632;&#9632;&#9632;';
  else if (lives === 2) livesEl.innerHTML = '&#9632;&#9632;&#9633;';
  else if (lives === 1) livesEl.innerHTML = '&#9632;&#9633;&#9633;';
  else livesEl.innerHTML = '&#9633;&#9633;&#9633;';
}

function update() {
  if (state !== 'playing') return;

  player.vy += GRAVITY * player.gravDir;
  player.y += player.vy;

  if (player.gravDir === 1) {
    if (player.y + PLAYER_H >= FLOOR) {
      player.y = FLOOR - PLAYER_H;
      player.vy = 0;
      player.onGround = true;
    } else { player.onGround = false; }
    if (player.y <= CEIL) { player.y = CEIL; player.vy = 0; }
  } else {
    if (player.y <= CEIL) {
      player.y = CEIL;
      player.vy = 0;
      player.onGround = true;
    } else { player.onGround = false; }
    if (player.y + PLAYER_H >= FLOOR) { player.y = FLOOR - PLAYER_H; player.vy = 0; }
  }

  if (player.flipping) {
    player.flipScale += player.flipDir * 0.18;
    if (Math.abs(player.flipScale) > 1.2) player.flipDir *= -1;
    if (player.flipScale >= 1 && player.flipDir === 1) { player.flipScale = 1; player.flipping = false; }
  }

  if (invincible > 0) invincible--;

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
    spawnInterval = Math.max(40, spawnInterval - 3);
  }

  if (score > 0 && score % 10 === 0 && enemies.length === 0) {
    wave++;
    waveEl.textContent = wave;
  }

  for (let e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    e.wobble += 0.15;

    const py = player.y;
    const ph = PLAYER_H;
    const px = player.x;
    const pw = PLAYER_W;

    const overlapX = px + pw > e.x && px < e.x + e.w;
    const overlapY = py + ph > e.y && py < e.y + e.h;

    if (overlapX && overlapY) {
      const stompDown = player.gravDir === 1 && player.vy > 0 &&
        py + ph - player.vy <= e.y + 4;
      const stompUp = player.gravDir === -1 && player.vy < 0 &&
        py - player.vy >= e.y + e.h - 4;

      if (stompDown || stompUp) {
        e.alive = false;
        score++;
        scoreEl.textContent = score;
        emitParticles(e.x + e.w / 2, e.y + e.h / 2, '#a78bfa', 12);
        player.vy = JUMP_FORCE * 0.5 * player.gravDir * -1;
      } else if (invincible === 0) {
        lives--;
        invincible = 90;
        updateUI();
        emitParticles(px + pw / 2, py + ph / 2, '#f87171', 10);
        if (lives <= 0) { gameOver(); return; }
      }
    }

    if (e.x < -ENEMY_W * 2 || e.x > W + ENEMY_W * 2) e.alive = false;
  }

  enemies = enemies.filter(e => e.alive);

  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function gameOver() {
  state = 'gameover';
  overlay.innerHTML = `
    <h1 style="color:#f87171">Game<br>Over</h1>
    <p>SCORE &nbsp;<strong style="color:#a78bfa;opacity:1">${score}</strong><br>WAVE &nbsp;<strong style="color:#a78bfa;opacity:1">${wave}</strong></p>
    <button id="startBtn" onclick="startGame()">PLAY AGAIN</button>
  `;
  overlay.style.display = 'flex';
  if (isMobile()) mobileBtn.style.display = 'none';
}

function drawRoundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#0d0d18';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, CEIL); ctx.lineTo(x, FLOOR); ctx.stroke();
  }

  ctx.fillStyle = '#1e1e35';
  ctx.fillRect(0, 0, W, CEIL);
  ctx.fillRect(0, FLOOR, W, H - FLOOR);

  ctx.fillStyle = '#a78bfa';
  ctx.fillRect(0, CEIL - 2, W, 2);
  ctx.fillRect(0, FLOOR, W, 2);

  ctx.fillStyle = '#2a2a45';
  for (let x = 10; x < W; x += 22) {
    ctx.beginPath();
    ctx.moveTo(x, FLOOR);
    ctx.lineTo(x + 8, FLOOR + 14);
    ctx.lineTo(x + 16, FLOOR);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, CEIL);
    ctx.lineTo(x + 8, CEIL - 14);
    ctx.lineTo(x + 16, CEIL);
    ctx.fill();
  }

  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let e of enemies) {
    if (!e.alive) continue;
    const wobbleX = Math.sin(e.wobble) * 2;
    ctx.save();
    ctx.translate(e.x + e.w / 2 + wobbleX, e.y + e.h / 2);
    if (!e.onCeil) ctx.scale(e.vx < 0 ? -1 : 1, 1);
    else ctx.scale(e.vx < 0 ? -1 : 1, -1);

    drawRoundRect(-12, -12, 24, 24, 5, '#f87171');
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(-3, -2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -2, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(1, 4, 5, 0.2, Math.PI - 0.2);
    ctx.stroke();
    ctx.fillStyle = '#f87171';
    const legOff = Math.sin(e.wobble * 2) * 5;
    ctx.fillRect(-10, 12, 6, 4 + legOff);
    ctx.fillRect(4, 12, 6, 4 - legOff);

    ctx.restore();
  }

  const px = player.x;
  const py = player.y;
  const blink = invincible > 0 && Math.floor(invincible / 6) % 2 === 0;

  if (!blink) {
    ctx.save();
    ctx.translate(px + PLAYER_W / 2, py + PLAYER_H / 2);
    ctx.scale(1, player.flipScale);

    ctx.fillStyle = '#7c3aed';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-6, -10);
    ctx.lineTo(-6, 10);
    ctx.fill();

    drawRoundRect(-10, -14, 20, 28, 4, '#a78bfa');

    ctx.fillStyle = '#0d0d18';
    ctx.fillRect(-7, -10, 14, 8);
    ctx.fillStyle = '#67e8f9';
    ctx.fillRect(-6, -9, 5, 6);
    ctx.fillRect(1, -9, 5, 6);

    ctx.fillStyle = '#7c3aed';
    ctx.fillRect(-9, 12, 8, 6);
    ctx.fillRect(1, 12, 8, 6);

    ctx.restore();

    ctx.fillStyle = '#a78bfa';
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    if (player.gravDir === 1) {
      ctx.moveTo(px + PLAYER_W / 2, py + PLAYER_H + 8);
      ctx.lineTo(px + PLAYER_W / 2 - 5, py + PLAYER_H + 2);
      ctx.lineTo(px + PLAYER_W / 2 + 5, py + PLAYER_H + 2);
    } else {
      ctx.moveTo(px + PLAYER_W / 2, py - 8);
      ctx.lineTo(px + PLAYER_W / 2 - 5, py - 2);
      ctx.lineTo(px + PLAYER_W / 2 + 5, py - 2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  state = 'playing';
  overlay.style.display = 'none';
  if (isMobile()) mobileBtn.style.display = 'block';
  initGame();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flipGravity(); } });
canvas.addEventListener('click', flipGravity);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flipGravity(); }, { passive: false });
mobileBtn.addEventListener('click', flipGravity);
mobileBtn.addEventListener('touchstart', e => { e.preventDefault(); flipGravity(); }, { passive: false });

loop();
</script>
</body>
</html>
